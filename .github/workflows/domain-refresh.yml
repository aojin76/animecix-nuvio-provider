name: Provider Domain Refresh

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Alan adlarını ara ve doğrudan doğrula
        run: node scripts/refresh-domains.js

      - name: Provider bundle testleri
        run: npm test

      - name: Doğrulanmış değişiklikleri PR olarak yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- domains.json; then
            echo "Doğrulanmış alan adı değişikliği yok."
            exit 0
          fi

          branch="auto/domain-registry-${GITHUB_RUN_ID}"
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains.json
          git commit -m "chore: alan adı kaydını otomatik güncelle"
          git push --set-upstream origin "$branch"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "chore: alan adı kaydını otomatik güncelle" \
            --body "Günlük alan adı araması yalnızca doğrudan doğrulanan adayları kayda aldı."
